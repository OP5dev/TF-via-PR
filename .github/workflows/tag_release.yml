---
name: Tag Release

on:
  push:
    tags: [v*.*.*]
  release:
    types: [released]

jobs:
  Draft-release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write # Required for release operation.

    steps:
      - name: Draft release
        env:
          GH_REF: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(gh api /repos/${GH_REPO}/releases/generate-notes --method POST --field tag_name="${GH_REF}" --jq .body)
          range=$(sed -nE 's|.*/compare/(.+)$|\1|p' <<< "$notes")
          changes=$(sed -nE 's|^\* (.+) by @[^ ]+ in (https://[^ ]+/pull/([0-9]+))$|* [#\3](\2) \1|p' <<< "$notes")
          cat > notes.md << EOF
          \`\`\`yml
          uses: ${GH_REPO,,}@${GITHUB_SHA} # ${GH_REF}
          \`\`\`

          > [!TIP]
          > Placeholder for manual input of release highlight.

          ### Changes [\`${range}\`](https://github.com/${GH_REPO}/compare/${range})

          ${changes}
          EOF
          flags=(); [[ "$GH_REF" == *-* ]] && flags+=(--prerelease)
          url=$(gh release create "$GH_REF" --draft --title "$GH_REF" --notes-file notes.md "${flags[@]}")
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  Tag-release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write # Required for tag operation.

    steps:
      - name: Tag release version
        env:
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GH_TAG%%.*}
          latest=$(gh api --paginate /repos/${GH_REPO}/releases --jq ".[] | select(.draft == false and .prerelease == false and (.tag_name | startswith(\"${version}.\"))) | .tag_name" | sort -V | tail -1)
          [[ "$latest" == "$GH_TAG" ]] || { echo "Skip: ${GH_TAG} is not the latest ${version}.x"; exit 0; }
          gh api /repos/${GH_REPO}/git/refs/tags/${version} --method PATCH --silent --field sha="${GITHUB_SHA}" --field force=true || \
          gh api /repos/${GH_REPO}/git/refs --method POST --silent --field sha="${GITHUB_SHA}" --field ref="refs/tags/${version}"
